<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="scos-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect width="64" height="64" rx="16" fill="url(#scos-grad)" />

  <!-- Inner Subtle Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- Graduation Mortarboard / Academic Diamond -->
  <g filter="url(#glow)">
    <!-- Cap Diamond Top -->
    <path d="M32 14L52 24L32 34L12 24L32 14Z" fill="#FFFFFF" />
    
    <!-- Cap Under Skullcap -->
    <path d="M20 28.5V38.5C20 44 25.5 48 32 48C38.5 48 44 44 44 38.5V28.5L32 34.5L20 28.5Z" fill="#E2E8F0" />
    
    <!-- Central Campus Circuit Core / Academic Spark -->
    <circle cx="32" cy="24" r="3" fill="url(#gold-grad)" />
    
    <!-- Tassel String and Gold Tassel -->
    <path d="M32 24L48 27V38" stroke="#FCD34D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="48" cy="39" r="2.5" fill="#F59E0B" />

    <!-- Pulse Signal Rings (Smart Campus Connectivity) -->
    <path d="M25 43C27.2 44.3 29.5 45 32 45C34.5 45 36.8 44.3 39 43" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
