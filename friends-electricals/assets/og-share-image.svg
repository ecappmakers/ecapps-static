<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#004cb8" /> <stop offset="100%" stop-color="#0066ff" /> </linearGradient>
        <linearGradient id="accentGradient" x1="0" y1="0" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b" /> <stop offset="100%" stop-color="#fbbf24" /> </linearGradient>
        <pattern id="circuitPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
            <path d="M10 10 H 90 V 90 H 10 Z" fill="none" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
            <path d="M50 10 V 90 M10 50 H 90" fill="none" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
            <circle cx="50" cy="50" r="5" fill="white" fill-opacity="0.05"/>
        </pattern>
    </defs>

    <rect width="1200" height="630" fill="url(#bgGradient)" />
    <rect width="1200" height="630" fill="url(#circuitPattern)" />

    <g transform="translate(100, 100)">
        
        <g transform="translate(0, 20)">
            <path d="M50 0 L 20 60 H 55 L 35 110 L 85 45 H 50 L 80 0 Z" fill="url(#accentGradient)">
                 <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite" />
            </path>
            <path d="M110 30 C 130 30, 150 50, 150 75 C 150 100, 130 120, 110 120 L 90 120 L 90 100 L 110 100 C 120 100, 130 90, 130 75 C 130 60, 120 50, 110 50 L 100 50 L 100 30 L 110 30 Z" fill="white" opacity="0.9"/>
            <rect x="-10" y="75" width="60" height="15" rx="5" fill="white" opacity="0.8" transform="rotate(-15)"/>
        </g>

        <g transform="translate(200, 50)">
            <text font-family="Arial, sans-serif" font-weight="800" font-size="72" fill="white" letter-spacing="1">
                FRIENDS ELECTRICALS
            </text>
            <text font-family="Arial, sans-serif" font-weight="800" font-size="72" fill="white" letter-spacing="1" y="80">
                &amp; PLUMBING
            </text>

            <rect y="120" width="600" height="4" fill="url(#accentGradient)" rx="2"/>

            <text font-family="Arial, sans-serif" font-weight="600" font-size="32" fill="#fbbf24" y="170" letter-spacing="0.5">
                ELECTRICAL • PLUMBING • HARDWARE • APPLIANCES
            </text>

            <text font-family="Arial, sans-serif" font-weight="500" font-size="24" fill="white" opacity="0.9" y="230">
                Tuticorin's Premier Wholesale &amp; Retail Partner | Est. 2015
            </text>
        </g>
    </g>

    <text x="1150" y="590" font-family="Arial, sans-serif" font-weight="500" font-size="20" fill="white" opacity="0.6" text-anchor="end">
        friendselectricals.store
    </text>
</svg>