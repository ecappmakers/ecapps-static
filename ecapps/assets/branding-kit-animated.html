<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EC App Makers Studio - Brand Assets</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        body { font-family: 'Outfit', sans-serif; transition: background-color 0.3s, color 0.3s; }
        
        .checker-bg-light {
            background-color: #f3f4f6;
            background-image: linear-gradient(45deg, #e5e7eb 25%, transparent 25%), 
                              linear-gradient(-45deg, #e5e7eb 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #e5e7eb 75%), 
                              linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
            background-size: 20px 20px;
        }
        .dark .checker-bg-light {
            background-color: #1f2937;
            background-image: linear-gradient(45deg, #374151 25%, transparent 25%), 
                              linear-gradient(-45deg, #374151 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #374151 75%), 
                              linear-gradient(-45deg, transparent 75%, #374151 75%);
        }

        /* Preview Overrides */
        .neutral-stop-1 { stop-color: #000000; }
        .neutral-stop-2 { stop-color: #475569; }
        .neutral-stop-3 { stop-color: #000000; }

        /* Dark Mode Overrides */
        @media (prefers-color-scheme: dark) {
            .ec-halo-global { stroke: #000000 !important; }
            .neutral-stop-1 { stop-color: #ffffff; }
            .neutral-stop-2 { stop-color: #94a3b8; }
            .neutral-stop-3 { stop-color: #ffffff; }
        }
        
        /* Force preview colors to match toggle state */
        body.dark .ec-halo-global { stroke: #000000 !important; }
        body.dark .neutral-stop-1 { stop-color: #ffffff !important; }
        body.dark .neutral-stop-2 { stop-color: #94a3b8 !important; }
        body.dark .neutral-stop-3 { stop-color: #ffffff !important; }
        body.dark .ec-tagline-global { fill: #94a3b8 !important; }

        body:not(.dark) .ec-halo-global { stroke: #ffffff !important; }
        body:not(.dark) .neutral-stop-1 { stop-color: #000000 !important; }
        body:not(.dark) .neutral-stop-2 { stop-color: #475569 !important; }
        body:not(.dark) .neutral-stop-3 { stop-color: #000000 !important; }
        body:not(.dark) .ec-tagline-global { fill: #64748b !important; }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 dark:bg-slate-900 dark:text-slate-200 p-8 transition-colors duration-300">

        <!-- 1. Main Horizontal Logo -->

                        <linearGradient id="main-text-gold" x1="0%" y1="0%" x2="200%" y2="0%">

                            <stop offset="25%" stop-color="#fbbf24" /> <!-- Bright Gold -->
                            <stop offset="50%" stop-color="#ffffff" /> <!-- Pure Shine -->
                            <stop offset="75%" stop-color="#fbbf24" /> <!-- Bright Gold -->
                            <stop offset="100%" stop-color="#d97706" /> <!-- Rich Gold -->
                            <animate attributeName="x1" from="-100%" to="100%" dur="3s" repeatCount="indefinite" />
                            <animate attributeName="x2" from="100%" to="300%" dur="3s" repeatCount="indefinite" />
                        </linearGradient>

                        <!-- Icon Gradient (User Space) -->
                        <linearGradient id="main-icon-gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="0">
                            <stop offset="0%" stop-color="#d97706" />
                            <stop offset="25%" stop-color="#fbbf24" />
                            <stop offset="50%" stop-color="#ffffff" />
                            <stop offset="75%" stop-color="#fbbf24" />
                            <stop offset="100%" stop-color="#d97706" />
                            <animate attributeName="x1" from="-256" to="256" dur="3s" repeatCount="indefinite" />
                            <animate attributeName="x2" from="256" to="768" dur="3s" repeatCount="indefinite" />
                        </linearGradient>

                        <linearGradient id="main-neutral-grad" x1="0%" y1="0%" x2="200%" y2="0%">
                            <stop class="neutral-stop-1" offset="0%" />
                            <stop class="neutral-stop-2" offset="50%" />
                            <stop class="neutral-stop-3" offset="100%" />
                            <animate attributeName="x1" from="-100%" to="100%" dur="4s" repeatCount="indefinite" />
                            <animate attributeName="x2" from="100%" to="300%" dur="4s" repeatCount="indefinite" />
                        </linearGradient>
                    </defs>
                    <style>
                        .ec-halo-global { stroke: #ffffff; }
                        .ec-accent-main { stroke: url(#main-icon-gold); }
                        .ec-text-gold-main { fill: url(#main-text-gold); }
                        .ec-neutral-main { stroke: url(#main-neutral-grad); }
                        .ec-text-neutral-main { fill: url(#main-neutral-grad); }
                        .ec-tagline-global { fill: #64748b; }
                    </style>
                    <g transform="translate(10, 10) scale(0.5)">
                        <path class="ec-halo-global" d="M190 64 H 100 A 36 36 0 0 0 64 100 V 156 A 36 36 0 0 0 100 192 H 190" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
                        <path class="ec-halo-global" d="M160 128 H 64" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
                        <!-- Body -->
                        <path class="ec-neutral-main" d="M190 64 H 100 A 36 36 0 0 0 64 100 V 156 A 36 36 0 0 0 100 192 H 190" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
                        <!-- Accent (Center Stroke) -->
                        <path class="ec-accent-main" d="M160 128 H 64" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
                    </g>
                    <g font-family="Outfit, sans-serif">

                            <tspan class="ec-text-neutral-main">EC </tspan><tspan class="ec-text-gold-main">App Makers</tspan><tspan class="ec-text-neutral-main"> Studio</tspan>
                        </text>
                        <text class="ec-tagline-global" x="162" y="105" font-size="18" font-weight="400" letter-spacing="2.5" style="text-transform: uppercase;">Innovating Digital Solutions</text>
                    </g>

            </div>

    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        const body = document.body;
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            body.classList.add('dark');
        }
        toggleBtn.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                body.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                body.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        });
        function copyToClipboard(elementId) {
            const copyText = document.getElementById(elementId);
            copyText.select();
            copyText.setSelectionRange(0, 99999); 
            document.execCommand("copy");
            const btn = document.querySelector(`button[onclick="copyToClipboard('${elementId}')"]`);
            const originalText = btn.innerText;
            btn.innerText = "Copied!";
            setTimeout(() => btn.innerText = originalText, 2000);
        }
    </script>
