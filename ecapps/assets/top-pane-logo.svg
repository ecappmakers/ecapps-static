                <svg class="preview-svg" width="600" height="150" viewBox="0 0 600 150" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Text/Box Gradient (Bounding Box) -->
                        <linearGradient id="hbox-gold-grad" x1="0%" y1="0%" x2="200%" y2="0%">
                            <stop offset="0%" stop-color="#d97706" />
                            <stop offset="25%" stop-color="#fbbf24" />
                            <stop offset="50%" stop-color="#ffffff" />
                            <stop offset="75%" stop-color="#fbbf24" />
                            <stop offset="100%" stop-color="#d97706" />
                            <animate attributeName="x1" from="-100%" to="100%" dur="3s" repeatCount="indefinite" />
                            <animate attributeName="x2" from="100%" to="300%" dur="3s" repeatCount="indefinite" />
                        </linearGradient>
                         
                        <!-- Icon Gradient (User Space) -->
                        <linearGradient id="hbox-icon-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="0">
                            <stop offset="0%" stop-color="#d97706" />
                            <stop offset="25%" stop-color="#fbbf24" />
                            <stop offset="50%" stop-color="#ffffff" />
                            <stop offset="75%" stop-color="#fbbf24" />
                            <stop offset="100%" stop-color="#d97706" />
                            <animate attributeName="x1" from="-256" to="256" dur="3s" repeatCount="indefinite" />
                            <animate attributeName="x2" from="256" to="768" dur="3s" repeatCount="indefinite" />
                        </linearGradient>

                        <linearGradient id="hbox-neutral-grad" x1="0%" y1="0%" x2="200%" y2="0%">
                            <stop class="neutral-stop-1" offset="0%" />
                            <stop class="neutral-stop-2" offset="50%" />
                            <stop class="neutral-stop-3" offset="100%" />
                            <animate attributeName="x1" from="-100%" to="100%" dur="4s" repeatCount="indefinite" />
                            <animate attributeName="x2" from="100%" to="300%" dur="4s" repeatCount="indefinite" />
                        </linearGradient>
                    </defs>
                    <style>
                        .ec-halo-global { stroke: #ffffff; }
                        .ec-border-hbox { stroke: url(#hbox-gold-grad); }
                        .ec-accent-hbox { stroke: url(#hbox-icon-grad); }
                        .ec-text-gold-hbox { fill: url(#hbox-gold-grad); }
                        .ec-neutral-hbox { stroke: url(#hbox-neutral-grad); }
                        .ec-text-neutral-hbox { fill: url(#hbox-neutral-grad); }
                        .ec-tagline-global { fill: #64748b; }
                        .neutral-stop-1 { stop-color: #000000; }
                        .neutral-stop-2 { stop-color: #475569; }
                        .neutral-stop-3 { stop-color: #000000; }
                        @media (prefers-color-scheme: dark) {
                            .ec-halo-global { stroke: #000000; }
                            .neutral-stop-1 { stop-color: #ffffff; }
                            .neutral-stop-2 { stop-color: #94a3b8; }
                            .neutral-stop-3 { stop-color: #ffffff; }
                            .ec-tagline-global { fill: #94a3b8; }
                        }
                    </style>
                    <g transform="translate(10, 10) scale(0.5)">
                        <!-- Border -->
                        <rect class="ec-border-hbox" x="24" y="24" width="208" height="208" rx="40" stroke-width="16" stroke-linecap="round"/>
                        <g transform="translate(25.6 25.6) scale(0.8)">
                            <path class="ec-halo-global" d="M190 64 H 100 A 36 36 0 0 0 64 100 V 156 A 36 36 0 0 0 100 192 H 190" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
                            <path class="ec-halo-global" d="M160 128 H 64" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
                            <!-- Body -->
                            <path class="ec-neutral-hbox" d="M190 64 H 100 A 36 36 0 0 0 64 100 V 156 A 36 36 0 0 0 100 192 H 190" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
                            <!-- Accent -->
                            <path class="ec-accent-hbox" d="M160 128 H 64" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
                        </g>
                    </g>
                    <g font-family="Outfit, sans-serif">
                        <text x="160" y="75" font-size="42" font-weight="700" letter-spacing="-0.5">
                            <tspan class="ec-text-neutral-hbox">EC </tspan><tspan class="ec-text-gold-hbox">App Makers</tspan><tspan class="ec-text-neutral-hbox"> Studio</tspan>
                        </text>
                        <text class="ec-tagline-global" x="162" y="105" font-size="18" font-weight="400" letter-spacing="2.5" style="text-transform: uppercase;">Innovating Digital Solutions</text>
                    </g>
                </svg>
