<svg class="preview-svg" width="180" height="180" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Use userSpaceOnUse to fix horizontal line visibility issue -->
    <linearGradient id="app-gold-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="0">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="25%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
      <animate attributeName="x1" from="-256" to="256" dur="3s" repeatCount="indefinite" />
      <animate attributeName="x2" from="256" to="768" dur="3s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="app-neutral-grad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop class="neutral-stop-1" offset="0%" />
      <stop class="neutral-stop-2" offset="50%" />
      <stop class="neutral-stop-3" offset="100%" />
      <animate attributeName="x1" from="-100%" to="100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" from="100%" to="300%" dur="4s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <style>
    .ec-halo-global { stroke: #ffffff; }
    .ec-border-app { stroke: url(#app-gold-grad); }
    .ec-accent-app { stroke: url(#app-gold-grad); }
    .ec-neutral-app { stroke: url(#app-neutral-grad); }
  </style>
  <!-- Gold Border -->
  <rect class="ec-border-app" x="24" y="24" width="208" height="208" rx="40" stroke-width="16" stroke-linecap="round"/>
  <g transform="translate(25.6 25.6) scale(0.8)">
    <path class="ec-halo-global" d="M190 64 H 100 A 36 36 0 0 0 64 100 V 156 A 36 36 0 0 0 100 192 H 190" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="ec-halo-global" d="M160 128 H 64" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Body -->
    <path class="ec-neutral-app" d="M190 64 H 100 A 36 36 0 0 0 64 100 V 156 A 36 36 0 0 0 100 192 H 190" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Accent -->
    <path class="ec-accent-app" d="M160 128 H 64" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
